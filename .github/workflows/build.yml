# Workflow name
name: CI/CD Pipeline

on:
  # Manually trigger workflow runs
  workflow_dispatch:
  # Run on push to main
  push:
    branches:
      - main
      - develop
  # Run on pull requests (needed for SonarCloud PR analysis)
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend   # el pom.xml está en backend/
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Cache Maven packages
        uses: actions/cache@v5
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Run Tests
        run: mvn -B test

  sonar:
    name: SonarCloud analysis
    runs-on: ubuntu-latest
    needs: tests
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # clones completos para mejor análisis

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Cache SonarCloud packages
        uses: actions/cache@v5
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Maven packages
        uses: actions/cache@v5
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
  # Build's job
  build:
    name: Build & Package
    needs: sonar
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend   # Se posiciona dentro de backend/

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: maven              # Maneja el caché de Maven de forma nativa sin actions/cache

      - name: Build JAR with Maven
        run: mvn -B package -DskipTests

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: springboot-app-jar
          path: backend/target/*.jar  # Ruta relativa desde la raíz del repo

      - name: Build & push Docker image
        uses: mr-smithers-excellent/docker-build-push@v6
        with:
          image: jorgeandres2007/lab1arq-2026-ii   # Ej: dbotiaudea/interstellar-ice-backend
          tags: latest
          registry: docker.io
          directory: backend                                # Especifica la carpeta raíz para Docker
          dockerfile: backend/Dockerfile                    # Ruta exacta del Dockerfile
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
